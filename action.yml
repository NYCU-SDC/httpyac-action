name: 'httpYac Reporter'
description: 'Execute httpYac CLI tests for user journeys and generate JSON reports'
author: 'pylin'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  scenarios-path:
    description: 'Path to the scenarios directory containing user journeys'
    required: false
    default: './scenarios/user-journey'
  output-dir:
    description: 'Directory to save JSON output files'
    required: false
    default: './httpyac-results'
  httpyac-version:
    description: 'Version of httpYac CLI to use'
    required: false
    default: 'latest'
  env:
    description: 'Environment variables to pass to httpYac tests'
    required: true
    default: |
      BASE_URL=http://127.0.0.1:4010/api
      LOGIN_USER_ID=00000000-0000-0000-0000-000000000001

outputs:
  results-dir:
    description: 'Directory containing the generated JSON result files'
    value: ${{ steps.run-tests.outputs.results-dir }}
  journey-count:
    description: 'Number of user journeys tested'
    value: ${{ steps.run-tests.outputs.journey-count }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install httpYac CLI
      shell: bash
      run: |
        if [ "${{ inputs.httpyac-version }}" = "latest" ]; then
          npm install -g httpyac
        else
          npm install -g httpyac@${{ inputs.httpyac-version }}
        fi
    
    - name: Install Action Dependencies
      shell: bash
      run: |
        cd ${{ github.action_path }}
        npm install --production
    
    - name: Run httpYac Tests
      id: run-tests
      shell: bash
      env: 
        HTTPYAC_ENV: ${{ inputs.env }}
      run: |
        node ${{ github.action_path }}/dist/index.js \
          --scenarios-path "${{ inputs.scenarios-path }}" \
          --output-dir "${{ inputs.output-dir }}"
